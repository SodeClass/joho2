<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>アルファベットカウンター</title>
    <style>
        :root {
            --primary-color: #333;
            --bg-color: #ffffff;
            --border-color: #ccc;
            --btn-bg: #f0f0f0;
            --btn-hover: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1.1rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #666;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        button {
            padding: 8px 16px;
            font-size: 1rem;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:focus {
            outline: 2px solid #666;
            outline-offset: 2px;
        }

        .result-section {
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
        }

        .total-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .total-number {
            font-size: 3rem;
            font-weight: bold;
            display: block;
            line-height: 1;
            margin-top: 10px;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .char-item {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .char-letter {
            font-weight: bold;
            font-size: 1.2rem;
            color: #555;
        }

        .char-count {
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .char-percent {
            font-size: 0.9rem;
            color: #888;
            margin-top: 2px;
        }

        .chart-section {
            margin-top: 30px;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .chart-layout {
            display: flex;
            width: 100%;
            height: 200px; /* 全体の高さ */
        }

        .y-axis {
            width: 40px;
            position: relative;
            font-size: 0.85rem;
            color: #666;
            text-align: right;
            padding-right: 8px;
            margin-bottom: 25px; /* 下のラベル分を空ける */
            border-right: 1px solid #ccc;
        }

        .y-axis-ticks {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 8px;
            left: 0;
        }

        .y-tick {
            position: absolute;
            right: 0;
            transform: translateY(50%); /* 中心を下端に合わせる */
            line-height: 1;
            width: 100%;
        }

        /* 0% は一番下 */
        .y-tick.zero {
            bottom: 0;
        }

        .chart-main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            margin-bottom: 25px; /* ラベルのスペース */
        }
        
        /* 破線の背景レイヤー */
        .grid-lines {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
            pointer-events: none;
        }
        
        .grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #ccc;
            z-index: 1;
        }
        
        /* 実線（底面）*/
        .grid-line.base {
            border-top: 1px solid #ccc;
            bottom: 0;
        }

        .chart-container {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-left: 10px; /* Aの左側のゆとり */
            z-index: 2; /* 破線より手前に */
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            flex: 1;
            height: 100%;
            min-width: 0; 
            position: relative;
        }

        .bar {
            width: 80%;
            max-width: 25px;
            height: 100%;
            background-color: transparent;
            display: flex;
            align-items: flex-end;
        }

        .bar-fill {
            width: 100%;
            background-color: #4CAF50;
            height: 0%;
            transition: height 0.3s ease;
        }

        .bar-label {
            position: absolute;
            bottom: -25px; /* 実線の下に配置 */
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
            height: 20px;
            line-height: 20px;
        }

        @media (max-width: 600px) {
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .bar-label {
                font-size: 0.65rem;
            }
            .y-axis {
                font-size: 0.7rem;
                width: 30px;
                padding-right: 4px;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const clearBtn = document.getElementById('clear-btn');
            const totalCountDisplay = document.getElementById('total-count');
            const charGrid = document.getElementById('char-grid');
            const chartContainer = document.getElementById('chart-container');
            const yAxisTicks = document.getElementById('y-axis-ticks');
            
            // モーダル関連
            
            
            
            
            

            // Initialize the A-Z grid and chart
            const charCounts = {};
            for (let i = 65; i <= 90; i++) {
                const char = String.fromCharCode(i);
                charCounts[char] = 0;
                
                // Create grid item
                const item = document.createElement('div');
                item.className = 'char-item';
                item.innerHTML = `
                    <span class="char-letter">${char}</span>
                    <span class="char-count" id="count-${char}">0</span>
                    <span class="char-percent" id="percent-${char}">0.0%</span>
                `;
                charGrid.appendChild(item);

                // Create chart bar
                const barWrapper = document.createElement('div');
                barWrapper.className = 'bar-wrapper';
                barWrapper.innerHTML = `
                    <div class="bar">
                        <div class="bar-fill" id="bar-fill-${char}"></div>
                    </div>
                    <span class="bar-label">${char}</span>
                `;
                chartContainer.appendChild(barWrapper);
            }
            
            // Y軸の初期化 (0%のみ)
            yAxisTicks.innerHTML = `<div class="y-tick zero">0%</div>`;
            document.getElementById('grid-lines').innerHTML = `<div class="grid-line base" style="bottom: 0%"></div>`;

            // Function to calculate and update counts
            const updateCounts = () => {
                const text = textInput.value;
                let total = 0;
                
                // Reset counts
                for (let i = 65; i <= 90; i++) {
                    charCounts[String.fromCharCode(i)] = 0;
                }

                // Count alphabets
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (/^[a-zA-Z]$/.test(char)) {
                        total++;
                        const upperChar = char.toUpperCase();
                        charCounts[upperChar]++;
                    }
                }

                // 割合の計算と最大%の取得
                let maxPercent = 0;
                const percents = {};
                for (let i = 65; i <= 90; i++) {
                    const char = String.fromCharCode(i);
                    const count = charCounts[char];
                    const p = total > 0 ? (count / total) * 100 : 0;
                    percents[char] = p;
                    if (p > maxPercent) {
                        maxPercent = p;
                    }
                }

                // Y軸の目盛りを計算 (2%刻み)
                // 最大%が0の場合は 2% を最大として扱う
                let axisMax = 2; 
                if (maxPercent > 0) {
                    // maxPercent以上の最小の偶数を探す
                    axisMax = Math.ceil(maxPercent / 2) * 2;
                }
                
                // 目盛りと破線の再構築
                let ticksHTML = `<div class="y-tick zero">0%</div>`;
                let gridsHTML = `<div class="grid-line base" style="bottom: 0%"></div>`; // 実線部分（底）
                
                for (let tick = 2; tick <= axisMax; tick += 2) {
                    const posPercent = (tick / axisMax) * 100;
                    ticksHTML += `<div class="y-tick" style="bottom: ${posPercent}%">${tick}%</div>`;
                    gridsHTML += `<div class="grid-line" style="bottom: ${posPercent}%"></div>`;
                }
                yAxisTicks.innerHTML = ticksHTML;
                document.getElementById('grid-lines').innerHTML = gridsHTML;

                // Update UI
                totalCountDisplay.textContent = total;
                for (let i = 65; i <= 90; i++) {
                    const char = String.fromCharCode(i);
                    const count = charCounts[char];
                    const p = percents[char];
                    
                    document.getElementById(`count-${char}`).textContent = count;
                    document.getElementById(`percent-${char}`).textContent = total > 0 ? p.toFixed(1) + "%" : "0.0%";

                    // 高さは axisMax を 100% とした相対値
                    const barHeight = axisMax > 0 ? (p / axisMax) * 100 : 0;
                    
                    // IDで取得できない（クローン時を考慮）ので、直接DOM操作する代わりに元の要素を更新
                    const originalFill = document.getElementById(`bar-fill-${char}`);
                    if (originalFill) {
                        originalFill.style.height = `${barHeight}%`;
                    }
                }
                
                
            };
            
            

            // Event listeners
            textInput.addEventListener('input', updateCounts);
            
            clearBtn.addEventListener('click', () => {
                textInput.value = '';
                updateCounts();
                textInput.focus();
            });
            
            
            
            
        });
    </script>
</head>
<body>
    <h1>アルファベットカウンター</h1>
    <p>文章を入力すると、アルファベットの数を自動で集計します。</p>

    <div class="input-group">
        <label for="text-input">入力欄</label>
        <textarea id="text-input" placeholder="ここにテキストを入力・貼り付けしてください"></textarea>
    </div>
    <div class="controls">
        <button id="clear-btn" type="button">クリア</button>
    </div>

    <div class="result-section">
        <div class="total-display">
            <span class="total-label">合計</span>
            <span class="total-number" id="total-count">0</span>
        </div>

        <div class="char-grid" id="char-grid">
            <!-- A-Z items will be generated by JS -->
        </div>
    </div>

    <div class="chart-section" id="chart-section">
        <div class="chart-title">出現頻度グラフ</div>
        <div class="chart-layout">
            <div class="y-axis">
                <div class="y-axis-ticks" id="y-axis-ticks">
                    <!-- Ticks will be generated by JS -->
                </div>
            </div>
            <div class="chart-main">
                <div class="grid-lines" id="grid-lines">
                    <!-- Grid lines will be generated by JS -->
                </div>
                <div class="chart-container" id="chart-container">
                    <!-- Bars will be generated by JS -->
                </div>
            </div>
        </div>
    </div>

    </body>
</html>
