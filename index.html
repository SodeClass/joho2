<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>アルファベットカウンター</title>
    <style>
        :root {
            --primary-color: #333;
            --bg-color: #ffffff;
            --border-color: #ccc;
            --btn-bg: #f0f0f0;
            --btn-hover: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1.1rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #666;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        button {
            padding: 8px 16px;
            font-size: 1rem;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:focus {
            outline: 2px solid #666;
            outline-offset: 2px;
        }

        .result-section {
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
        }

        .total-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .total-number {
            font-size: 3rem;
            font-weight: bold;
            display: block;
            line-height: 1;
            margin-top: 10px;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .char-item {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .char-letter {
            font-weight: bold;
            font-size: 1.2rem;
            color: #555;
        }

        .char-count {
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .char-percent {
            font-size: 0.9rem;
            color: #888;
            margin-top: 2px;
        }

        .chart-section {
            margin-top: 30px;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            position: relative;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0;
        }

        .expand-btn {
            background-color: #fff;
            border: 1px solid #999;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s;
        }
        .expand-btn:hover { background-color: #eee; }

        .chart-layout {
            display: flex;
            align-items: flex-end;
            margin-bottom: 10px;
            width: 100%;
        }

        .y-axis {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 150px;
            padding-right: 8px;
            font-size: 0.85rem;
            color: #666;
            text-align: right;
            border-right: 1px solid #ccc;
            padding-bottom: 26px; /* ラベルの高さ分を確保 */
            min-width: 35px;
            position: relative;
        }
        
        .y-axis-ticks {
            position: absolute;
            top: 0; bottom: 26px; right: 8px; left: 0;
        }
        
        .y-tick {
            position: absolute;
            right: 0;
            transform: translateY(-50%);
            line-height: 1;
            width: 100%;
        }
        /* 0% は一番下 */
        .y-tick.zero {
            bottom: 0;
            transform: translateY(50%);
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex: 1;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
            /* 画面に合わせるためギャップを小さくし、あふれないように */
            gap: 1px;
            min-width: 0; 
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 0; /* flexアイテムが縮めるように */
        }

        .bar {
            width: 80%;
            max-width: 25px;
            height: 150px;
            background-color: #eee;
            border-radius: 4px 4px 0 0;
            position: relative;
            display: flex;
            align-items: flex-end;
        }

        .bar-fill {
            width: 100%;
            background-color: #4CAF50;
            border-radius: 4px 4px 0 0;
            height: 0%;
            transition: height 0.3s ease;
        }

        .bar-label {
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
        }

        /* --- モーダル (フルスクリーングラフ) のスタイル --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; /* 背景を白に塗りつぶす */
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            overflow: hidden;
        }
        .modal-overlay.active {
            display: block;
            opacity: 1;
        }
        
        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1010;
            background: #f0f0f0;
            border: 1px solid #999;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 拡大時にグラフ自体をコピーしてここに配置するコンテナ */
        .expanded-chart-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        /* 複製されたグラフのスタイル */
        .expanded-chart-wrapper .chart-layout {
            width: 100%;
            height: 80%; /* 縦方向に大きく */
            max-width: 1200px;
        }
        .expanded-chart-wrapper .y-axis {
            height: 100%;
            font-size: 1.1rem;
            min-width: 50px;
            padding-right: 15px;
        }
        .expanded-chart-wrapper .bar {
            height: 100%;
            max-width: 50px;
        }
        .expanded-chart-wrapper .bar-label {
            font-size: 1.2rem;
            margin-top: 15px;
        }

        /* スマホ等でのメディアクエリ */
        @media (max-width: 600px) {
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .bar-label {
                font-size: 0.65rem;
            }
            .y-axis {
                font-size: 0.7rem;
                min-width: 25px;
                padding-right: 4px;
            }
            /* 縦持ちの場合、モーダル内のグラフを90度回転 */
            @media (orientation: portrait) {
                .expanded-chart-wrapper {
                    padding: 0;
                }
                .expanded-chart-wrapper .chart-layout {
                    /* 回転させるため、widthとheightを反転させたサイズにする */
                    width: 90vh; 
                    height: 80vw;
                    transform: rotate(90deg);
                    transform-origin: center center;
                }
                /* 回転時に閉じるボタンが被らないように */
                .modal-close-btn {
                    top: auto;
                    bottom: 30px;
                    right: 30px;
                }
            }
            /* 横持ちの場合はそのまま全画面 */
            @media (orientation: landscape) {
                .expanded-chart-wrapper {
                    padding: 20px;
                }
                .expanded-chart-wrapper .chart-layout {
                    height: 85%;
                }
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const clearBtn = document.getElementById('clear-btn');
            const totalCountDisplay = document.getElementById('total-count');
            const charGrid = document.getElementById('char-grid');
            const chartContainer = document.getElementById('chart-container');
            const yAxisTicks = document.getElementById('y-axis-ticks');
            
            // モーダル関連
            const expandBtn = document.getElementById('expand-btn');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalCloseBtn = document.getElementById('modal-close-btn');
            const originalChartLayout = document.getElementById('original-chart-layout');
            const expandedChartWrapper = document.getElementById('expanded-chart-wrapper');

            // Initialize the A-Z grid and chart
            const charCounts = {};
            for (let i = 65; i <= 90; i++) {
                const char = String.fromCharCode(i);
                charCounts[char] = 0;
                
                // Create grid item
                const item = document.createElement('div');
                item.className = 'char-item';
                item.innerHTML = `
                    <span class="char-letter">${char}</span>
                    <span class="char-count" id="count-${char}">0</span>
                    <span class="char-percent" id="percent-${char}">0.0%</span>
                `;
                charGrid.appendChild(item);

                // Create chart bar
                const barWrapper = document.createElement('div');
                barWrapper.className = 'bar-wrapper';
                barWrapper.innerHTML = `
                    <div class="bar">
                        <div class="bar-fill" id="bar-fill-${char}"></div>
                    </div>
                    <span class="bar-label">${char}</span>
                `;
                chartContainer.appendChild(barWrapper);
            }
            
            // Y軸の初期化 (0%のみ)
            yAxisTicks.innerHTML = `<div class="y-tick zero">0%</div>`;

            // Function to calculate and update counts
            const updateCounts = () => {
                const text = textInput.value;
                let total = 0;
                
                // Reset counts
                for (let i = 65; i <= 90; i++) {
                    charCounts[String.fromCharCode(i)] = 0;
                }

                // Count alphabets
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (/^[a-zA-Z]$/.test(char)) {
                        total++;
                        const upperChar = char.toUpperCase();
                        charCounts[upperChar]++;
                    }
                }

                // 割合の計算と最大%の取得
                let maxPercent = 0;
                const percents = {};
                for (let i = 65; i <= 90; i++) {
                    const char = String.fromCharCode(i);
                    const count = charCounts[char];
                    const p = total > 0 ? (count / total) * 100 : 0;
                    percents[char] = p;
                    if (p > maxPercent) {
                        maxPercent = p;
                    }
                }

                // Y軸の目盛りを計算 (2%刻み)
                // 最大%が0の場合は 2% を最大として扱う
                let axisMax = 2; 
                if (maxPercent > 0) {
                    // maxPercent以上の最小の偶数を探す
                    axisMax = Math.ceil(maxPercent / 2) * 2;
                }
                
                // 目盛りの再構築
                let ticksHTML = `<div class="y-tick zero">0%</div>`;
                for (let tick = 2; tick <= axisMax; tick += 2) {
                    // bottomの割合(%)を計算 (axisMaxが100%の高さ)
                    const posPercent = (tick / axisMax) * 100;
                    ticksHTML += `<div class="y-tick" style="bottom: ${posPercent}%">${tick}%</div>`;
                }
                yAxisTicks.innerHTML = ticksHTML;

                // Update UI
                totalCountDisplay.textContent = total;
                for (let i = 65; i <= 90; i++) {
                    const char = String.fromCharCode(i);
                    const count = charCounts[char];
                    const p = percents[char];
                    
                    document.getElementById(`count-${char}`).textContent = count;
                    document.getElementById(`percent-${char}`).textContent = total > 0 ? p.toFixed(1) + "%" : "0.0%";

                    // 高さは axisMax を 100% とした相対値
                    const barHeight = axisMax > 0 ? (p / axisMax) * 100 : 0;
                    
                    // IDで取得できない（クローン時を考慮）ので、直接DOM操作する代わりに元の要素を更新
                    const originalFill = document.getElementById(`bar-fill-${char}`);
                    if (originalFill) {
                        originalFill.style.height = `${barHeight}%`;
                    }
                }
                
                // モーダルが開いている場合、クローンされたDOMの中身も更新する
                if (modalOverlay.classList.contains('active')) {
                    syncExpandedChart();
                }
            };
            
            const syncExpandedChart = () => {
                // 現在のグラフDOMをクローンしてモーダル内に配置
                expandedChartWrapper.innerHTML = '';
                // IDの重複を防ぐため、クローンしたものからはIDを削除するか無視する運用
                const clonedNode = originalChartLayout.cloneNode(true);
                clonedNode.removeAttribute('id');
                // クローン内のバー要素のアニメーションを無効化（瞬時に反映）またはそのまま
                expandedChartWrapper.appendChild(clonedNode);
            };

            // Event listeners
            textInput.addEventListener('input', updateCounts);
            
            clearBtn.addEventListener('click', () => {
                textInput.value = '';
                updateCounts();
                textInput.focus();
            });
            
            // 拡大表示ボタンの挙動
            expandBtn.addEventListener('click', () => {
                syncExpandedChart();
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden'; // 背後のスクロールを止める
            });
            
            // 閉じるボタンの挙動
            modalCloseBtn.addEventListener('click', () => {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            });
        });
    </script>
</head>
<body>
    <h1>アルファベットカウンター</h1>
    <p>文章を入力すると、アルファベットの数を自動で集計します。</p>

    <div class="input-group">
        <label for="text-input">入力欄</label>
        <textarea id="text-input" placeholder="ここにテキストを入力・貼り付けしてください"></textarea>
    </div>
    <div class="controls">
        <button id="clear-btn" type="button">クリア</button>
    </div>

    <div class="result-section">
        <div class="total-display">
            <span class="total-label">合計</span>
            <span class="total-number" id="total-count">0</span>
        </div>

        <div class="char-grid" id="char-grid">
            <!-- A-Z items will be generated by JS -->
        </div>
    </div>

    <div class="chart-section" id="chart-section">
        <div class="chart-header">
            <div class="chart-title">出現頻度グラフ</div>
            <button class="expand-btn" id="expand-btn">
                <span>🔍 拡大表示</span>
            </button>
        </div>
        <div class="chart-layout" id="original-chart-layout">
            <div class="y-axis">
                <div class="y-axis-ticks" id="y-axis-ticks">
                    <!-- Ticks will be generated by JS -->
                </div>
            </div>
            <div class="chart-container" id="chart-container">
                <!-- Bars will be generated by JS -->
            </div>
        </div>
    </div>

    <!-- Modal for Expanded Chart -->
    <div class="modal-overlay" id="modal-overlay">
        <button class="modal-close-btn" id="modal-close-btn">閉じる ✖</button>
        <div class="expanded-chart-wrapper" id="expanded-chart-wrapper">
            <!-- グラフがここにクローンされます -->
        </div>
    </div>
</body>
</html>
