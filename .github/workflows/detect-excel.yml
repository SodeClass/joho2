name: Detect 3D Model Excel File

on:
  push:
    paths:
      - '3Dmodel-expo/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-excel-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect spreadsheet file and update file-info.json
        run: |
          python3 -c "
          import os, json, glob

          files = glob.glob('3Dmodel-expo/*.xlsx')
          if not files:
              files = glob.glob('3Dmodel-expo/*.xls') + glob.glob('3Dmodel-expo/*.csv')

          if files:
              target_file = os.path.basename(files[0])
              info_path = '3Dmodel-expo/file-info.json'
              current_file = None
              if os.path.exists(info_path):
                  try:
                      with open(info_path, 'r', encoding='utf-8') as f:
                          current_file = json.load(f).get('fileName')
                  except Exception:
                      pass

              if current_file != target_file:
                  info = {'fileName': target_file}
                  with open(info_path, 'w', encoding='utf-8') as f:
                      json.dump(info, f, ensure_ascii=False, indent=2)
                      f.write('\n')
                  print(f'Updated file-info.json to: {target_file}')
              else:
                  print(f'file-info.json is already up to date ({target_file}), skipping.')
          else:
              print('No spreadsheet file found in 3Dmodel-expo/')
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 3Dmodel-expo/file-info.json
          if git diff --staged --quiet; then
            echo "No changes in file-info.json"
          else
            git commit -m "Auto-update 3Dmodel-expo file-info.json [skip ci]"
            git push
          fi
